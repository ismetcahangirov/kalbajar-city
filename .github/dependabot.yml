version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      next-react:
        patterns: ["next", "eslint-config-next", "react", "react-dom", "@types/react*"]
      tooling:
        dependency-type: development
        exclude-patterns: ["eslint-config-next", "@types/react*"]
      runtime:
        dependency-type: production
        exclude-patterns: ["next", "react", "react-dom"]
    # Majors of the toolchain wait until the rest of it supports them, by a
    # deliberate upgrade: typescript-eslint has to support the TypeScript
    # major (it refused 7.0 in #35), @types/node follows the Node major CI and
    # production run (24), and an ESLint major lands with eslint-config-next
    # support. Minor and patch updates keep coming.
    ignore:
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
      - dependency-name: "eslint"
        update-types: ["version-update:semver-major"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
