name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  NEXT_TELEMETRY_DISABLED: 1

jobs:
  checks:
    name: Lint, format, typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v5
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm typecheck

  unit:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v5
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test

  # Applies every migration to an empty database, twice, then seeds twice:
  # both must succeed and the second runs must change nothing.
  database:
    name: Database
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: kalbajar
          POSTGRES_PASSWORD: kalbajar
          POSTGRES_DB: kalbajar
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U kalbajar -d kalbajar"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
      # The object store from docker-compose.yml, for the media pipeline (#11).
      storage:
        image: rustfs/rustfs:1.0.3
        env:
          RUSTFS_ACCESS_KEY: kalbajar
          RUSTFS_SECRET_KEY: kalbajar-secret
        ports:
          - 9000:9000
    env:
      DATABASE_URL: postgres://kalbajar:kalbajar@localhost:5432/kalbajar
      BETTER_AUTH_URL: http://localhost:3010
      S3_ENDPOINT: http://localhost:9000
      S3_REGION: eu-central
      S3_BUCKET: kalbajar
      S3_ACCESS_KEY_ID: kalbajar
      S3_SECRET_ACCESS_KEY: kalbajar-secret
      S3_PUBLIC_URL: http://localhost:9000/kalbajar
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v5
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Schema and migrations are in sync
        run: |
          pnpm db:generate
          git diff --exit-code -- drizzle
          test -z "$(git status --porcelain -- drizzle)"
      - run: pnpm db:migrate
      - name: Migrations are idempotent
        run: pnpm db:migrate
      - run: pnpm db:seed
      - name: Seed is idempotent
        run: pnpm db:seed
      - name: Wait for the object store
        run: for i in $(seq 1 30); do curl -s -o /dev/null http://localhost:9000/ && exit 0; sleep 1; done; exit 1
      - name: Prepare the bucket
        run: pnpm storage:setup
      - run: pnpm test:db

  # Builds without DATABASE_URL on purpose: the build must never need a
  # database. E2E then runs the build against a migrated, seeded one.
  # Sharded since the quality suites of #30 (every route × locale × width,
  # axe, keyboard, reduced motion) roughly doubled the E2E run.
  build-e2e:
    name: Build and E2E (${{ matrix.shard }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1/3, 2/3, 3/3]
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: kalbajar
          POSTGRES_PASSWORD: kalbajar
          POSTGRES_DB: kalbajar
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U kalbajar -d kalbajar"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
      # Lead e-mails: the E2E tests read them back through Mailpit's API.
      mailpit:
        image: axllent/mailpit:v1.31
        ports:
          - 1025:1025
          - 8025:8025
      # The object store from docker-compose.yml, for the media pipeline (#11).
      storage:
        image: rustfs/rustfs:1.0.3
        env:
          RUSTFS_ACCESS_KEY: kalbajar
          RUSTFS_SECRET_KEY: kalbajar-secret
        ports:
          - 9000:9000
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v5
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Exact key only. Restoring another commit's Turbopack cache built CSS
      # without a newly imported stylesheet (src/styles/shell.css in #39), so
      # E2E tested something production would not ship.
      - uses: actions/cache@v6
        with:
          path: .next/cache
          key: next-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-${{ hashFiles('src/**') }}
      - run: pnpm build
      - name: Migrate and seed the E2E database
        env:
          DATABASE_URL: postgres://kalbajar:kalbajar@localhost:5432/kalbajar
        run: pnpm db:migrate && pnpm db:seed
      - name: Wait for the object store
        run: for i in $(seq 1 30); do curl -s -o /dev/null http://localhost:9000/ && exit 0; sleep 1; done; exit 1
      # Storage settings reach only the steps that use them: the build must
      # not need them either.
      - name: Prepare the bucket
        env:
          BETTER_AUTH_URL: http://localhost:3011
          S3_ENDPOINT: http://localhost:9000
          S3_REGION: eu-central
          S3_BUCKET: kalbajar
          S3_ACCESS_KEY_ID: kalbajar
          S3_SECRET_ACCESS_KEY: kalbajar-secret
          S3_PUBLIC_URL: http://localhost:9000/kalbajar
        run: pnpm storage:setup
      - run: pnpm exec playwright install --with-deps chromium
      # A throwaway secret for the E2E server's sessions; never used elsewhere.
      - run: echo "BETTER_AUTH_SECRET=$(openssl rand -base64 32)" >> "$GITHUB_ENV"
      - run: pnpm test:e2e --shard=${{ matrix.shard }}
        env:
          DATABASE_URL: postgres://kalbajar:kalbajar@localhost:5432/kalbajar
          SMTP_HOST: localhost
          SMTP_PORT: 1025
          SMTP_FROM: Kalbajar City <no-reply@kalbajarcity.com>
          MAILPIT_URL: http://localhost:8025
          S3_ENDPOINT: http://localhost:9000
          S3_REGION: eu-central
          S3_BUCKET: kalbajar
          S3_ACCESS_KEY_ID: kalbajar
          S3_SECRET_ACCESS_KEY: kalbajar-secret
          S3_PUBLIC_URL: http://localhost:9000/kalbajar
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report-${{ strategy.job-index }}
          path: playwright-report
          retention-days: 7
      # tests/e2e/quality-responsive.spec.ts: every route, locale and width.
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: responsive-screenshots-${{ strategy.job-index }}
          path: test-results/responsive
          if-no-files-found: ignore
          retention-days: 7

  # The JS budget per public route (CLAUDE.md §5), read from the production
  # build's manifests by scripts/check-js-budget.mjs: no server, no
  # database. Its own job, so a budget failure reads as one and does not
  # wait on E2E.
  js-budget:
    name: JS budget
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v5
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # The same exact key as build-e2e: the same sources, never another
      # commit's cache.
      - uses: actions/cache@v6
        with:
          path: .next/cache
          key: next-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-${{ hashFiles('src/**') }}
      - run: pnpm build
      - run: pnpm budget:js

  # Lighthouse on home, the catalogue, an apartment and an article, median of
  # three runs each (CLAUDE.md §5, #30), against the production build and a
  # seeded database, as a first visit (the preloader included). Desktop must
  # score 93+; CLS must stay under 0.05 on both form factors. The mobile
  # score is measured and reported against the same 93 but does not fail the
  # job yet: home is at 0.92 (the run of #93), still just under; the other
  # three routes already score 0.93 or more. Once home meets the budget, the
  # job turns the mobile score into an error (#30).
  lighthouse:
    name: Lighthouse
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: kalbajar
          POSTGRES_PASSWORD: kalbajar
          POSTGRES_DB: kalbajar
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U kalbajar -d kalbajar"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v5
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # The same exact key as build-e2e: the same sources, never another
      # commit's cache.
      - uses: actions/cache@v6
        with:
          path: .next/cache
          key: next-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-${{ hashFiles('src/**') }}
      # Built without DATABASE_URL, as in build-e2e: the build never needs one.
      - run: pnpm build
      - name: Migrate, seed and publish the measured article
        env:
          DATABASE_URL: postgres://kalbajar:kalbajar@localhost:5432/kalbajar
        run: pnpm db:migrate && pnpm db:seed && pnpm exec tsx tests/lighthouse/publish-article.mts
      # A throwaway secret for the server's sessions; never used elsewhere.
      - name: Start the production server
        env:
          DATABASE_URL: postgres://kalbajar:kalbajar@localhost:5432/kalbajar
          PORT: 3011
          BETTER_AUTH_URL: http://localhost:3011
          NEXT_PUBLIC_SITE_URL: http://localhost:3011
        run: |
          BETTER_AUTH_SECRET=$(openssl rand -base64 32) nohup pnpm start > server.log 2>&1 &
          for i in $(seq 1 60); do curl -sf http://localhost:3011/api/health > /dev/null && exit 0; sleep 1; done
          cat server.log; exit 1
      - name: Desktop, enforced
        run: >-
          pnpm exec lhci autorun --config=tests/lighthouse/lighthouserc.desktop.json
          --collect.url=http://localhost:3011/
          --collect.url=http://localhost:3011/menziller
          --collect.url=http://localhost:3011/menziller/blok-c-menzil-102
          --collect.url=http://localhost:3011/xeberler/lighthouse-meqale
      - name: Mobile, CLS enforced, score reported
        if: success() || failure()
        run: >-
          pnpm exec lhci autorun --config=tests/lighthouse/lighthouserc.mobile.json
          --collect.url=http://localhost:3011/
          --collect.url=http://localhost:3011/menziller
          --collect.url=http://localhost:3011/menziller/blok-c-menzil-102
          --collect.url=http://localhost:3011/xeberler/lighthouse-meqale
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: lighthouse-report
          path: lighthouse-report
          retention-days: 14

  ci-complete:
    name: CI complete
    if: always()
    needs: [checks, unit, database, build-e2e, js-budget, lighthouse]
    runs-on: ubuntu-latest
    steps:
      - name: Every job that ran succeeded
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          echo "$RESULTS"
          for job in checks unit database build-e2e js-budget lighthouse; do
            echo "$RESULTS" | jq -e --arg j "$job" 'has($j)' > /dev/null || { echo "missing job: $job"; exit 1; }
          done
          failed=$(echo "$RESULTS" | jq -r 'to_entries[] | select(.value.result != "success" and .value.result != "skipped") | .key')
          if [ -n "$failed" ]; then
            echo "Failed jobs: $failed"
            exit 1
          fi
